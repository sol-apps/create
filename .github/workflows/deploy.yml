name: Deploy to solhann.net

# A push to main deploys. The pipeline is simple.yml, beside this file; every other
# app calls the same one. The repo name is the slug is the subdomain.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/simple.yml
    secrets: inherit
